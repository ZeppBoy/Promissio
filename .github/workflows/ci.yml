name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DiffEngine_Disabled: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Verify solution and documentation
        shell: pwsh
        run: ./tools/verify.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
